name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built scripts are committed and fresh
        run: git diff --exit-code plugins/

  # The shipped scripts have no dependencies and promise Node 18.3+, so run them on the oldest supported Node.
  runtime-node18:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.3
      - name: Run built scripts on the fixture
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: tests/fixtures/claude-home
        run: |
          S=plugins/promptfolio/skills/promptfolio/scripts
          node $S/doctor.mjs --projects
          node $S/stats.mjs --claude-dir tests/fixtures/claude-home --year 2026 --tz UTC --out out
          test -s out/stats.json && test -s out/sample.json
          echo '{"schemaVersion":1,"vibe":"fun","language":"en","persona":{"className":"a","specialMove":"b","weakness":"c","nemesis":"d"},"diary":["a","b","c"],"awards":[{"title":"a","text":"b"},{"title":"c","text":"d"},{"title":"e","text":"f"}],"relationship":{"status":"a","text":"b"},"captions":{}}' > out/copy.json
          node $S/validate.mjs out/copy.json out/stats.json
