name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # ubuntu-latest ships Google Chrome with a working sandbox, so the PNG tests run there.
      - run: npm test
      - run: npm run build
      - name: Built scripts are committed and fresh
        run: git diff --exit-code plugins/

  # The shipped scripts have no dependencies and promise Node 18.3+, so run them on the oldest supported Node.
  runtime-node18:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.3
      - name: Run built scripts on the fixture
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: tests/fixtures/claude-home
        run: |
          S=plugins/promptfolio/skills/promptfolio/scripts
          node $S/doctor.mjs --projects
          node $S/stats.mjs --claude-dir tests/fixtures/claude-home --year 2026 --tz UTC --out out
          test -s out/stats.json && test -s out/sample.json
          echo '{"schemaVersion":2,"vibe":"fun","language":"en","title":"Shell Warlock","lines":{"tokens":"Tokens.","year":"A year.","toolkit":"Tools.","growth":"Growth."},"captions":{"instagram":"a","linkedin":"b","x":"c","discord":"d"}}' > out/copy.json
          node $S/validate.mjs out/copy.json out/stats.json
          node $S/render.mjs --dir out --no-png --style receipt --palette grape --cards tokens,year --formats square,readme
          test -s out/story.html && test -s out/readme-card.svg && test -s out/captions.json && test -s out/cards/receipt-year-square.html
